name: Verteller

# De app zet een verzoek in de branch rpg-data (requests/<id>.json). Claude Code stelt met jouw
# Claude-abonnement (secret CLAUDE_CODE_OAUTH_TOKEN) het vervolg van je verhaal; het antwoord komt in
# rpg-data/responses/<id>.json.
#
# request_id = "standby": warme verteller die ~10 min klaarstaat en nieuwe verzoeken meteen oppakt
# (de app start die zodra je hem opent). Anders: één losse run voor dat ene verzoek.
run-name: RPG ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Id van het verzoek in rpg-data/requests, of "standby"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Nooit twee warme vertellers tegelijk; losse runs mogen naast elkaar.
  group: ${{ inputs.request_id == 'standby' && 'rpg-standby' || format('rpg-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verteller:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.request_id == 'standby' && 50 || 12 }}
    env:
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rpg

      - uses: actions/checkout@v4
        with:
          ref: rpg-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code installeren
        run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund

      - name: Warme verteller
        if: inputs.request_id == 'standby'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node rpg/standby.mjs data

      - name: Beurt vertellen
        if: inputs.request_id != 'standby'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node rpg/run.mjs "$REQUEST_ID" data

      - name: Antwoord terugzetten
        if: always() && inputs.request_id != 'standby'
        working-directory: data
        run: |
          if [ ! -f "responses/$REQUEST_ID.json" ]; then
            mkdir -p responses
            printf '{"id":"%s","status":"fout","message":"De workflow liep vast voordat Claude klaar was. / The workflow got stuck before Claude finished.","resetAt":null,"answer":null,"finishedAt":"%s"}\n' \
              "$REQUEST_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "responses/$REQUEST_ID.json"
          fi
          git config user.name "freaking-rpg"
          git config user.email "freaking-rpg@users.noreply.github.com"
          git add -A responses
          git commit -q -m "Verteller-antwoord $REQUEST_ID" || exit 0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin rpg-data; then
              git push -q origin HEAD:rpg-data && exit 0
            else
              # De warme verteller was ons voor met hetzelfde antwoord: dan is het goed.
              git rebase --abort 2>/dev/null
              git fetch -q origin rpg-data
              git cat-file -e "origin/rpg-data:responses/$REQUEST_ID.json" 2>/dev/null && exit 0
            fi
            sleep $((i * 2))
          done
          exit 1
